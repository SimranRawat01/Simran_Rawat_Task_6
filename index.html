<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Mart - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Container -->
    <div class="login-container">

        <!-- Left Section: Illustration Panel -->
        <div class="left-section">
            <img src="https://png.pngtree.com/png-vector/20240614/ourmid/pngtree-dirty-clothes-and-washing-machine-png-image_12738071.png"
                alt="Laundry Illustration">
        </div>

        <!-- Right Section: Login Form Panel -->
        <div class="right-section">
            <div class="form-wrapper">
                <h1>Hello Again!</h1>
                <p class="subtitle">Welcome back! we missed you!</p>

                <form>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="abc@gmail.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>

                    <div class="form-options">
                        <a href="#" class="forgot-link">Forgot Password</a>
                    </div>

                    <button type="submit" class="btn-login">Login</button>

                    <p class="register-text">
                        Not a member? <a href="#">Register Now</a>
                    </p>
                </form>
            </div>
        </div>

    </div>

</body>

</html>
